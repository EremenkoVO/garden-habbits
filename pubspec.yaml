name: habit_garden
description: Локальный Android-трекер привычек с достижениями.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0
  dynamic_color: ^2.1.0
  material_ui: ^1.8.0
  provider: ^6.1.5+1
  sqflite: ^2.4.5
  path: ^1.9.1
  intl: ^0.20.2
  flutter_local_notifications: ^22.3.3
  flutter_timezone: ^5.1.1
  timezone: ^0.11.2
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
